backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "es"

collections:
  - name: "configuracion"
    label: "Configuración del mapa"
    files:
      - file: "content/settings.json"
        label: "Fondo del mapa"
        name: "settings"
        fields:
          - label: "Imagen de fondo (satelital o la que prefieras)"
            name: "background_image"
            widget: "image"
            required: false
            hint: "Sube una captura tipo satélite/aérea de Las Lomas. Déjalo vacío para usar el diseño ilustrado con lomas verdes."

  - name: "comunidades"
    label: "Comunidades de Las Lomas"
    files:
      - file: "content/communities.json"
        label: "Mapa de comunidades"
        name: "communities"
        fields:
          - label: "Comunidades"
            name: "communities"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "ID (no cambiar)", name: "id", widget: "string" }
              - { label: "Nombre de la comunidad", name: "name", widget: "string" }
              - { label: "Posición horizontal (0-100)", name: "x", widget: "number" }
              - { label: "Posición vertical (0-100)", name: "y", widget: "number" }
              - { label: "Descripción / historia", name: "intro", widget: "text" }
              - label: "Lugares turísticos"
                name: "spots"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - { label: "Nombre del lugar", name: "name", widget: "string" }
                  - { label: "Descripción", name: "desc", widget: "string" }
              - label: "Fotos"
                name: "photos"
                widget: "list"
                allow_add: true
                field: { label: "Foto", name: "image", widget: "image" }
              - label: "Enlaces"
                name: "links"
                widget: "list"
                summary: "{{fields.label}}"
                fields:
                  - { label: "Texto del botón", name: "label", widget: "string" }
                  - { label: "URL", name: "url", widget: "string" }
